<body>
    
    <div class="container">

    <form action="">
    <div class="form">

            <label for="uname">Name</label><br>
            <input type="text" name="" id="uname">

        </div>
    
        <div class="email">

            <input type="" name="" id="Age">
        </div>

        <div class="select">

                    <option value="text">Intern</option>
                    <option value="text">Professional</option>

        </div>

        </div>

        <div class="comment">

        </div>

        </div>

    </div>
